branches: [master]
apt: [libsodium-dev]
dependencies: both
services:
  postgres:
    image: postgres:18
    env:
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    options: >-
      --health-cmd pg_isready
      --health-interval 5s
      --health-retries 10
hooks:
  after-build:
  - name: Create the test database
    run: psql -h localhost -U postgres -c 'CREATE DATABASE test'
    env:
      PGPASSWORD: postgres
doctest: {}
fourmolu:
  version: 0.21.0.0
