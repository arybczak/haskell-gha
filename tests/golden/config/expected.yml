#   haskell-gha --config haskell-gha.conf.yml
name: Postgres CI

on:
  push:
    branches:
    - master
    - 'release/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 'GHC ${{ matrix.ghc }}, postgres ${{ matrix.postgres }}'
    runs-on: ubuntu-24.04
    # The database for the tests.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          # Only for CI.
        ports:
        - '5432:5432'
    strategy:
      fail-fast: false
      matrix:
        ghc:
        - '9.10'
        - '9.12'
        postgres:
        - '15'
        - '18'
        exclude:
        - ghc: '9.10'
          postgres: '15'
    steps:
    - uses: actions/checkout@v7

    - name: Install the system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libpq-dev postgresql-client

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    - name: Show the versions
      run: |
        ghc --version
        cabal --version
        echo "GHC ${{ steps.setup.outputs.ghc-version }}, cabal ${{ steps.setup.outputs.cabal-version }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Configure the project
      run: |
        cat >> cabal.project.local <<'EOF'
        jobs: 2

        package config
          ghc-options: -Werror -Wno-unused-imports

        package config
          flags: +postgres

        constraints: postgresql-libpq >= 0.10
        EOF

    - name: Enable the GHC job semaphore
      run: |
        echo 'semaphore: True' >> cabal.project.local

    - name: Make the build plan
      run: |
        cabal build all --dry-run

    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
        restore-keys: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

    - name: Build the dependencies
      run: |
        cabal build all --only-dependencies

    - uses: actions/cache/save@v6
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Show the Postgres version
      run: psql --version

    # Wait until the database accepts connections.
    - name: Wait for Postgres
      run: |
        until pg_isready -h localhost; do
          sleep 1
        done

    - name: Build
      run: |
        cabal build all

    - name: Check the documentation
      run: cabal haddock all
