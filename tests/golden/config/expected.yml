name: Postgres CI

on:
  push:
    branches:
    - master
    - 'release/**'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fourmolu:
    name: Fourmolu
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6

    - uses: haskell-actions/run-fourmolu@v12
      with:
        version: '0.19.0.1'
        pattern: |
          src/**/*.hs
          !src/Generated.hs

  hlint:
    name: HLint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6

    - uses: haskell-actions/hlint-setup@v2
      with:
        version: '3.8'

    - uses: haskell-actions/hlint-run@v2
      with:
        path: '["src", "test"]'
        fail-on: error

  build:
    name: 'GHC ${{ matrix.ghc }}, postgres ${{ matrix.postgres }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
        - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        ghc:
        - '9.10'
        - '9.12'
        postgres:
        - '15'
        - '18'
        exclude:
        - ghc: '9.10'
          postgres: '15'
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install the system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libpq-dev postgresql-client

    - uses: haskell-actions/setup@v2.8.2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    - name: Show the versions
      id: versions
      run: |
        ghc --version
        cabal --version
        echo "GHC ${{ steps.setup.outputs.ghc-version }}, cabal ${{ steps.setup.outputs.cabal-version }}, image $ImageOS $ImageVersion" >> "$GITHUB_STEP_SUMMARY"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

    - name: Show the Postgres version
      run: psql --version

    - name: Unpack the source tarballs
      run: |
        shopt -s extglob
        cabal sdist all --output-directory="$RUNNER_TEMP"/haskell-gha-sdist
        mkdir "$RUNNER_TEMP"/haskell-gha
        for f in cabal.project cabal.project.freeze cabal.project.local; do
          if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP"/haskell-gha; fi
        done
        tar -xzf "$RUNNER_TEMP"/haskell-gha-sdist/config-+([0-9.]).tar.gz --strip-components=1 -C "$RUNNER_TEMP"/haskell-gha

    - name: Configure the project
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cat >> cabal.project.local <<'EOF'
        jobs: 2

        package config
          ghc-options: -Werror -Wno-unused-imports

        package config
          flags: +postgres

        constraints: postgresql-libpq >= 0.10
        EOF

    - name: Enable the GHC job semaphore
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        echo 'semaphore: True' >> cabal.project.local

    - name: Make the build plan
      id: plan
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all --dry-run
        echo "hash=$(sha256sum dist-newstyle/cache/plan.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - uses: runs-on/cache/restore@v4
      id: cache
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ steps.versions.outputs.image }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ steps.plan.outputs.hash }}
        restore-keys: ${{ runner.os }}-${{ steps.versions.outputs.image }}-ghc-${{ steps.setup.outputs.ghc-version }}-

    - name: Build the dependencies
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all --only-dependencies

    - uses: runs-on/cache/save@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all

    - name: Show the executables
      run: cabal list-bin all

    - name: Check the packages
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        failed=0
        check() {
          echo "Checking the package $1"
          (cd "$2" && cabal check) || { echo "::error::cabal check failed for the package $1"; failed=1; }
        }
        check config .
        exit "$failed"

    - name: Build the documentation
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal haddock all --disable-documentation --haddock-all --haddock-for-hackage
