name: Postgres CI
cabal-version: latest
runs-on: ubuntu-24.04
timeout-minutes: 90
branches: [master, 'release/**']
submodules: recursive
matrix:
  postgres: ['15', '18']
  exclude:
    - ghc: '9.10'
      postgres: '15'
apt: [libpq-dev, postgresql-client]
services:
  # The database for the tests.
  postgres:
    image: postgres:${{ matrix.postgres }}
    env:
      POSTGRES_PASSWORD: postgres # Only for CI.
    ports: ['5432:5432']
    # The runner starts the steps when the database accepts connections.
    options: >-
      --health-cmd pg_isready
      --health-interval 5s
      --health-retries 10
permissions:
  contents: read
  # For the annotations of the test results.
  checks: write
hooks:
  after-setup:
    - name: Show the Postgres version
      run: psql --version
  after-build:
    - name: Show the executables
      run: cabal list-bin all
ghc-options: -Werror -Wno-unused-imports
cabal-project-local: |
  package config
    flags: +postgres

  constraints: postgresql-libpq >= 0.10
jobs: 2
tests: false
benchmarks: false
fourmolu:
  version: '0.19.0.1'
  pattern:
    - 'src/**/*.hs'
    - '!src/Generated.hs'
hlint:
  version: '3.8'
  fail-on: error
  path: [src, test]
actions:
  checkout: v6
  setup: v2.8.2
  cache: v5
  run-fourmolu: v12
  hlint-setup: v2
  hlint-run: v2
