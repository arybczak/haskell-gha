# To make it again, run:
#   haskell-gha --project-dir sub
name: CI

on:
  push:
    branches:
    - master
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: sub

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc:
        - '9.12'
    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: '3.16.1.0'

    - name: Show the versions
      run: |
        ghc --version
        cabal --version
        echo "GHC ${{ steps.setup.outputs.ghc-version }}, cabal ${{ steps.setup.outputs.cabal-version }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Configure the project
      run: |
        cat >> cabal.project.local <<'EOF'
        jobs: 4
        tests: True
        benchmarks: True

        package app
          ghc-options: -Werror
        EOF

    - name: Enable the GHC job semaphore
      run: |
        echo 'semaphore: True' >> cabal.project.local

    - name: Make the build plan
      run: |
        cabal build all --dry-run

    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('sub/dist-newstyle/cache/plan.json') }}
        restore-keys: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

    - name: Build the dependencies
      run: |
        cabal build all --only-dependencies

    - uses: actions/cache/save@v6
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      run: |
        cabal build all

    - name: Check the packages
      run: |
        (cd app && cabal check)

    - name: Make the source tarballs
      run: |
        cabal sdist all

    - name: Build the documentation
      run: |
        cabal haddock all --disable-documentation --haddock-all --haddock-for-hackage
