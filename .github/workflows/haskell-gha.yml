# This file is generated by haskell-gha 0.1.0.0. Do not edit it.
# To make it again, run:
#   haskell-gha
name: CI

on:
  push:
    branches:
    - master
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc:
        - '9.6'
        - '9.8'
        - '9.10'
        - '9.12'
        - '9.14'
    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: '3.16.1.0'

    - name: Show the versions
      run: |
        ghc --version
        cabal --version
        echo "GHC ${{ steps.setup.outputs.ghc-version }}, cabal ${{ steps.setup.outputs.cabal-version }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Configure the project
      run: |
        cat >> cabal.project.local <<'EOF'
        jobs: 4
        tests: True
        benchmarks: True

        package haskell-gha
          ghc-options: -Werror
        EOF

    - name: Enable parallel module builds for the local packages
      if: contains(fromJSON('["9.6"]'), matrix.ghc)
      run: |
        cat >> cabal.project.local <<'EOF'
        package haskell-gha
          ghc-options: -j4
        EOF

    - name: Enable the GHC job semaphore
      if: contains(fromJSON('["9.8","9.10","9.12","9.14"]'), matrix.ghc)
      run: |
        echo 'semaphore: True' >> cabal.project.local

    - name: Make the build plan
      run: |
        cabal build all --dry-run

    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
        restore-keys: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

    - name: Build the dependencies
      run: |
        cabal build all --only-dependencies

    - uses: actions/cache/save@v6
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      run: |
        cabal build all

    # The tool makes both workflows of the repository. A pull request that
    # changes the output must also change the workflows.
    - name: Make sure that the workflows are up to date
      run: |
        cabal run haskell-gha
        cabal run haskell-gha -- --project-dir examples/multi --config examples/multi/haskell-gha.conf.yml --output .github/workflows/haskell-gha-multi.yml
        git diff --exit-code

    - name: Run the tests
      run: |
        cabal test all --test-show-details=direct

    - name: Check the packages
      run: |
        cabal check

    - name: Make the source tarballs
      run: |
        cabal sdist all

    - name: Build the documentation
      run: |
        cabal haddock all --disable-documentation --haddock-all --haddock-for-hackage
