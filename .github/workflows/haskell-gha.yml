name: CI

on:
  push:
    branches:
    - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fourmolu:
    name: Fourmolu
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/run-fourmolu@v13
      with:
        version: '0.20.1.0'

  hlint:
    name: HLint
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/hlint-setup@c04631035af0a6787c85e33b3ea0128b8568b590
      with:
        version: '3.10'

    - uses: haskell-actions/hlint-run@d009541bdae0b8492992416e665bb6df8a3b5cde
      with:
        fail-on: suggestion

  build:
    name: 'GHC ${{ matrix.ghc }}, ${{ matrix.dependencies }}'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ghc:
        - '9.6'
        - '9.8'
        - '9.10'
        - '9.12'
        - '9.14'
        - '10.0'
        dependencies:
        - newest
        - oldest
        exclude:
        - ghc: '10.0'
          dependencies: oldest
    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: '3.16.1.0'

    - name: Show the versions
      id: versions
      run: |
        ghc --version
        cabal --version
        echo "GHC ${{ steps.setup.outputs.ghc-version }}, cabal ${{ steps.setup.outputs.cabal-version }}, image $ImageOS $ImageVersion" >> "$GITHUB_STEP_SUMMARY"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

    - name: Unpack the source tarballs
      run: |
        shopt -s extglob
        cabal sdist all --output-directory="$RUNNER_TEMP"/haskell-gha-sdist
        mkdir "$RUNNER_TEMP"/haskell-gha
        for f in cabal.project cabal.project.freeze cabal.project.local; do
          if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP"/haskell-gha; fi
        done
        tar -xzf "$RUNNER_TEMP"/haskell-gha-sdist/haskell-gha-+([0-9.]).tar.gz --strip-components=1 -C "$RUNNER_TEMP"/haskell-gha

    - name: Configure the project
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        if [ -f cabal.project.local ]; then
          echo '::error::The repository contains cabal.project.local, which holds the settings of one developer. Move the settings to cabal.project or to the key cabal-project-local of the configuration of haskell-gha, and remove the file from the repository.'
          exit 1
        fi
        cat >> cabal.project.local <<'EOF'
        jobs: 4
        tests: True
        benchmarks: True

        package haskell-gha
          ghc-options: -Werror
        EOF

    - name: Prefer the oldest dependencies
      if: matrix.dependencies == 'oldest'
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        echo 'prefer-oldest: True' >> cabal.project.local

    - name: Enable parallel module builds for the local packages
      if: contains(fromJSON('["9.6"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cat >> cabal.project.local <<'EOF'
        package haskell-gha
          ghc-options: -j4
        EOF

    - name: Enable the GHC job semaphore or parallel module builds
      if: contains(fromJSON('["9.8","9.10","9.12","9.14","10.0"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        if ghc --info | grep -F '("Semaphore version","2")' > /dev/null; then
        echo 'GHC uses version 2 of the semaphore protocol and cabal version 1, so GHC uses -j4.'
        cat >> cabal.project.local <<'EOF'
        package haskell-gha
          ghc-options: -j4
        EOF
        else
        echo 'GHC and cabal use version 1 of the semaphore protocol, so GHC uses the semaphore.'
        cat >> cabal.project.local <<'EOF'
        semaphore: True
        EOF
        fi

    - name: Make the build plan
      id: plan
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all --dry-run
        echo "hash=$(sha256sum dist-newstyle/cache/plan.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: haskell-gha.yml-${{ runner.os }}-${{ steps.versions.outputs.image }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ matrix.dependencies }}-${{ steps.plan.outputs.hash }}
        restore-keys: haskell-gha.yml-${{ runner.os }}-${{ steps.versions.outputs.image }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ matrix.dependencies }}-

    - name: Build the dependencies
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all --only-dependencies

    - uses: actions/cache/save@v6
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all

    # The tool makes both workflows of the repository. A pull request that
    # changes the output must also change the workflows. The hook runs in the
    # checkout, but the build ran in the copy of the source tarballs, so the
    # hook takes the binary from there.
    - name: Make sure that the workflows are up to date
      run: |
        bin=$(cd "$RUNNER_TEMP"/haskell-gha && cabal list-bin haskell-gha)
        "$bin" --check

    - name: Run the tests
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal test all --test-show-details=direct

    - name: Check the packages
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        failed=0
        check() {
          echo "Checking the package $1"
          (cd "$2" && cabal check) || { echo "::error::cabal check failed for the package $1"; failed=1; }
        }
        check haskell-gha .
        exit "$failed"

    - name: Build the documentation
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal haddock all --disable-documentation --haddock-for-hackage
