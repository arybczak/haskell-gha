name: CI (multi)

on:
  push:
    branches:
    - master
    - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: examples/multi

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ghc:
        - '9.6'
        - '9.8'
        - '9.10'
        - '9.12'
        - '9.14'
    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: '3.16.1.0'

    - name: Show the versions
      id: versions
      run: |
        ghc --version
        cabal --version
        echo "GHC ${{ steps.setup.outputs.ghc-version }}, cabal ${{ steps.setup.outputs.cabal-version }}, image $ImageOS $ImageVersion" >> "$GITHUB_STEP_SUMMARY"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

    - name: Unpack the source tarballs
      if: contains(fromJSON('["9.6","9.8"]'), matrix.ghc)
      run: |
        cabal sdist all --output-directory="$RUNNER_TEMP"/haskell-gha-sdist
        mkdir "$RUNNER_TEMP"/haskell-gha
        for f in cabal.project cabal.project.freeze cabal.project.local; do
          if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP"/haskell-gha; fi
        done
        mkdir -p "$RUNNER_TEMP"/haskell-gha/core
        tar -xzf "$RUNNER_TEMP"/haskell-gha-sdist/core-[0-9]*.tar.gz --strip-components=1 -C "$RUNNER_TEMP"/haskell-gha/core
        mkdir -p "$RUNNER_TEMP"/haskell-gha/extra
        tar -xzf "$RUNNER_TEMP"/haskell-gha-sdist/extra-[0-9]*.tar.gz --strip-components=1 -C "$RUNNER_TEMP"/haskell-gha/extra

    - name: Unpack the source tarballs
      if: contains(fromJSON('["9.10","9.12","9.14"]'), matrix.ghc)
      run: |
        cabal sdist all --output-directory="$RUNNER_TEMP"/haskell-gha-sdist
        mkdir "$RUNNER_TEMP"/haskell-gha
        for f in cabal.project cabal.project.freeze cabal.project.local; do
          if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP"/haskell-gha; fi
        done
        mkdir -p "$RUNNER_TEMP"/haskell-gha/core
        tar -xzf "$RUNNER_TEMP"/haskell-gha-sdist/core-[0-9]*.tar.gz --strip-components=1 -C "$RUNNER_TEMP"/haskell-gha/core
        mkdir -p "$RUNNER_TEMP"/haskell-gha/extra
        tar -xzf "$RUNNER_TEMP"/haskell-gha-sdist/extra-[0-9]*.tar.gz --strip-components=1 -C "$RUNNER_TEMP"/haskell-gha/extra
        mkdir -p "$RUNNER_TEMP"/haskell-gha/modern
        tar -xzf "$RUNNER_TEMP"/haskell-gha-sdist/modern-[0-9]*.tar.gz --strip-components=1 -C "$RUNNER_TEMP"/haskell-gha/modern

    - name: Configure the project
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cat >> cabal.project.local <<'EOF'
        jobs: 4
        tests: True
        benchmarks: True
        write-ghc-environment-files: always

        package core
          ghc-options: -Werror

        package extra
          ghc-options: -Werror

        package modern
          ghc-options: -Werror
        EOF

    - name: Enable parallel module builds for the local packages
      if: contains(fromJSON('["9.6"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cat >> cabal.project.local <<'EOF'
        package core
          ghc-options: -j4

        package extra
          ghc-options: -j4
        EOF

    - name: Enable the GHC job semaphore
      if: contains(fromJSON('["9.8","9.10","9.12","9.14"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        echo 'semaphore: True' >> cabal.project.local

    - name: Make the build plan
      id: plan
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all --dry-run
        echo "hash=$(sha256sum dist-newstyle/cache/plan.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ steps.versions.outputs.image }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ steps.plan.outputs.hash }}
        restore-keys: ${{ runner.os }}-${{ steps.versions.outputs.image }}-ghc-${{ steps.setup.outputs.ghc-version }}-

    - name: Build the dependencies
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all --only-dependencies

    - uses: actions/cache/save@v6
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Find the doctest version
      id: doctest
      if: contains(fromJSON('["9.12","9.14"]'), matrix.ghc)
      run: |
        version=$(cabal --store-dir="$RUNNER_TEMP"/doctest-store install doctest --ignore-project --dry-run | sed -n 's/^ - doctest-\([0-9.]*\) (exe:doctest).*/\1/p')
        if [ -z "$version" ]; then
          echo 'The dry run of cabal install shows no doctest version.' >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      id: doctest-cache
      if: contains(fromJSON('["9.12","9.14"]'), matrix.ghc)
      with:
        path: ~/.local/bin/doctest
        key: ${{ runner.os }}-${{ steps.versions.outputs.image }}-doctest-${{ steps.doctest.outputs.version }}-ghc-${{ steps.setup.outputs.ghc-version }}

    - name: Install doctest
      if: contains(fromJSON('["9.12","9.14"]'), matrix.ghc) && steps.doctest-cache.outputs.cache-hit != 'true'
      run: |
        cabal install doctest --ignore-project --install-method=copy --installdir="$HOME/.local/bin" --overwrite-policy=always --constraint='doctest ==${{ steps.doctest.outputs.version }}'

    - name: Build
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal build all

    - name: Run the tests
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal test all --test-show-details=direct

    - name: Run doctest for core
      if: contains(fromJSON('["9.12","9.14"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cd core
        "$HOME"/.local/bin/doctest -XGHC2021 src

    - name: Run doctest for extra
      if: contains(fromJSON('["9.12","9.14"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cd extra
        "$HOME"/.local/bin/doctest -XGHC2021 src

    - name: Run doctest for modern
      if: contains(fromJSON('["9.12","9.14"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cd modern
        "$HOME"/.local/bin/doctest -XGHC2024 -XOverloadedRecordDot src

    - name: Check the packages
      if: contains(fromJSON('["9.6","9.8"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        (cd core && cabal check)
        (cd extra && cabal check)

    - name: Check the packages
      if: contains(fromJSON('["9.10","9.12","9.14"]'), matrix.ghc)
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        (cd core && cabal check)
        (cd extra && cabal check)
        (cd modern && cabal check)

    - name: Build the documentation
      working-directory: ${{ runner.temp }}/haskell-gha
      run: |
        cabal haddock all --disable-documentation --haddock-all --haddock-for-hackage
