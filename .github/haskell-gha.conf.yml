branches:
- master
hooks:
  after-build:
  # The tool makes both workflows of the repository. A pull request that
  # changes the output must also change the workflows. The hook runs in the
  # checkout, but the build ran in the copy of the source tarballs, so the
  # hook takes the binary from there.
  - name: Make sure that the workflows are up to date
    run: |
      bin=$(cd "$RUNNER_TEMP"/haskell-gha && cabal list-bin haskell-gha)
      failed=0
      "$bin" --check || failed=1
      "$bin" --check --project-dir examples/multi --config examples/multi/haskell-gha.conf.yml --output .github/workflows/haskell-gha-multi.yml || failed=1
      exit "$failed"
dependencies: both
fourmolu:
  enabled: true
  version: 0.20.1.0
hlint:
  enabled: true
  version: '3.10'
